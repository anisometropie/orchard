<!doctype html>
<html>
  <head>
    <title>Orchard</title>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
      #map-status {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        font: 600 13px sans-serif;
        padding: 8px 12px;
        z-index: 10;
      }
      #map-status[hidden] {
        display: none;
      }
      .tree-editor {
        min-width: 190px;
        font: 13px sans-serif;
      }
      .tree-editor-title {
        font-weight: 700;
        margin-bottom: 10px;
      }
      .tree-editor-field {
        align-items: center;
        display: flex;
        gap: 7px;
      }
      .tree-editor-note,
      .tree-editor-error {
        font-size: 12px;
        margin-top: 8px;
      }
      .tree-editor-note {
        color: #555;
      }
      .tree-editor-error {
        color: #b42318;
      }
      .tree-editor-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .tree-editor-actions button {
        border: 1px solid #777;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 5px 10px;
      }
      .tree-editor-actions button[type="submit"] {
        background: #245c2a;
        border-color: #245c2a;
        color: white;
      }
      .tree-editor-actions button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="map-status">Loading orchard trees…</div>
    <div
      id="date-filter"
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        background: white;
        padding: 12px 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        z-index: 10;
        font-family: sans-serif;
        width: 280px;
      "
    >
      <label
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 8px;
          font-weight: 600;
        "
      >
        <input type="checkbox" id="date-filter-enabled" />
        Filter by planting date
      </label>

      <div id="date-label" style="font-size: 13px; margin-bottom: 8px">
        All dates
      </div>

      <input
        type="range"
        id="date-min"
        min="0"
        max="1000"
        value="0"
        style="width: 100%"
      />
      <input
        type="range"
        id="date-max"
        min="0"
        max="1000"
        value="1000"
        style="width: 100%; margin-top: 4px"
      />
    </div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "ign-ortho": {
              type: "raster",
              tiles: [
                "https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}",
              ],
              tileSize: 256,
              attribution: "© IGN",
            },
            orchard: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
          },
          layers: [
            {
              id: "ign-ortho",
              type: "raster",
              source: "ign-ortho",
            },
            {
              id: "trees",
              type: "circle",
              source: "orchard",
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  3,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  6,
                  9,
                ],
                "circle-color": [
                  "match",
                  ["get", "row_name"],
                  "1. Haut haut haut",
                  "#eeeeee",
                  "2. Haut haut",
                  "#3cb44b",
                  "3. Haut",
                  "#ffe119",
                  "4. Milieu haut",
                  "#4363d8",
                  "5. Milieu bas",
                  "#f58231",
                  "6. Milieu bas bas",
                  "#911eb4",
                  "7. Bas haut",
                  "#46f0f0",
                  "8. Bas",
                  "#f032e6",
                  "9. Bas bas",
                  "#bcf60c",
                  "10. Bas bas bas",
                  "#fabebe",
                  "11. Entrée",
                  "#008080",
                  "12. Entrée centre",
                  "#e6beff",
                  "13. Côté bambous",
                  "#9a6324",
                  "#808080",
                ],
                "circle-stroke-width": [
                  "case",
                  ["in", "pioneer", ["get", "roles"]],
                  2,
                  1,
                ],
                "circle-stroke-color": [
                  "case",
                  ["in", "pioneer", ["get", "roles"]],
                  "#000000",
                  "#ffffff",
                ],
                "circle-opacity": [
                  "case",
                  ["==", ["get", "is_alive"], false],
                  0.3,
                  1,
                ],
                "circle-stroke-opacity": [
                  "case",
                  ["==", ["get", "is_alive"], false],
                  0.3,
                  1,
                ],
              },
            },
            {
              id: "danger-rings",
              type: "circle",
              source: "orchard",
              filter: ["==", ["get", "is_in_danger"], true],
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  7,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  10,
                  13,
                ],
                "circle-color": "rgba(0, 0, 0, 0)",
                "circle-stroke-color": "#d40000",
                "circle-stroke-opacity": 0.95,
                "circle-stroke-width": 3,
              },
            },
          ],
        },
        center: [0.5, 0.5],
        zoom: 20,
        maxZoom: 24,
      });

      let treeTooltip;
      let treeEditor;

      function createDeadTreeCrossImage() {
        const size = 18;
        const pixels = new Uint8Array(size * size * 4);

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const isCross =
              Math.abs(x - y) <= 1 || Math.abs(size - 1 - x - y) <= 1;
            if (!isCross) continue;

            const offset = (y * size + x) * 4;
            pixels[offset + 3] = 255;
          }
        }

        return { width: size, height: size, data: pixels };
      }

      function createTreeTooltip(properties) {
        const tooltip = document.createElement("div");

        [
          ["Name", properties.name],
          ["Latin name", properties.latin_name],
          ["Date", properties.planted_on],
        ].forEach(([label, value]) => {
          if (value == null || value === "") return;

          const field = document.createElement("div");
          const labelElement = document.createElement("strong");
          labelElement.textContent = `${label}: `;
          field.append(labelElement, document.createTextNode(value));
          tooltip.append(field);
        });

        return tooltip;
      }

      function closeTreeEditor() {
        treeEditor?.remove();
        treeEditor = undefined;
      }

      function createTreeEditor(feature) {
        const form = document.createElement("form");
        form.className = "tree-editor";

        const title = document.createElement("div");
        title.className = "tree-editor-title";
        title.textContent = feature.properties.name || "Tree";

        const field = document.createElement("label");
        field.className = "tree-editor-field";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = feature.properties.is_in_danger === true;
        checkbox.disabled = feature.properties.is_alive === false;
        field.append(checkbox, document.createTextNode("In danger"));

        const error = document.createElement("div");
        error.className = "tree-editor-error";
        error.setAttribute("aria-live", "polite");
        error.hidden = true;

        const actions = document.createElement("div");
        actions.className = "tree-editor-actions";
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.textContent = "Cancel";
        cancelButton.addEventListener("click", closeTreeEditor);
        const saveButton = document.createElement("button");
        saveButton.type = "submit";
        saveButton.textContent = "OK";
        actions.append(cancelButton, saveButton);

        form.append(title, field);
        if (checkbox.disabled) {
          const note = document.createElement("div");
          note.className = "tree-editor-note";
          note.textContent = "A dead tree cannot be marked as in danger.";
          form.append(note);
        }
        form.append(error, actions);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          error.hidden = true;
          checkbox.disabled = true;
          cancelButton.disabled = true;
          saveButton.disabled = true;
          saveButton.textContent = "Saving…";

          try {
            await updateTreeDanger(feature.id, checkbox.checked);
            closeTreeEditor();
            await loadOrchardTrees();
          } catch (requestError) {
            error.textContent = requestError.message;
            error.hidden = false;
            checkbox.disabled = feature.properties.is_alive === false;
            cancelButton.disabled = false;
            saveButton.disabled = false;
            saveButton.textContent = "OK";
          }
        });

        return form;
      }

      async function updateTreeDanger(treeId, isInDanger) {
        if (treeId == null) throw new Error("This tree has no editable ID.");

        const response = await fetch(
          `/api/trees/${encodeURIComponent(treeId)}/danger`,
          {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ is_in_danger: isInDanger }),
          },
        );
        if (response.ok) return;
        if (response.status === 404) {
          throw new Error("This tree no longer exists.");
        }
        if (response.status === 409) {
          throw new Error("A dead tree cannot be marked as in danger.");
        }
        throw new Error("Could not update this tree. Please try again.");
      }

      map.on("mouseenter", "trees", (event) => {
        map.getCanvas().style.cursor = "pointer";
        if (treeEditor) return;

        const feature = event.features[0];
        treeTooltip?.remove();
        treeTooltip = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 10,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(createTreeTooltip(feature.properties))
          .addTo(map);
      });

      map.on("mouseleave", "trees", () => {
        map.getCanvas().style.cursor = "";
        treeTooltip?.remove();
        treeTooltip = undefined;
      });

      map.on("click", "trees", (event) => {
        const feature = event.features[0];
        treeTooltip?.remove();
        treeTooltip = undefined;
        closeTreeEditor();

        const popup = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 12,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(createTreeEditor(feature))
          .addTo(map);
        treeEditor = popup;
        popup.on("close", () => {
          if (treeEditor === popup) treeEditor = undefined;
        });
      });

      map.on("load", () => {
        map.addImage("dead-tree-cross", createDeadTreeCrossImage());
        map.addLayer({
          id: "dead-tree-crosses",
          type: "symbol",
          source: "orchard",
          filter: ["==", ["get", "is_alive"], false],
          layout: {
            "icon-image": "dead-tree-cross",
            "icon-size": [
              "case",
              ["<", ["to-number", ["get", "adult_height"]], 1.4],
              1 / 3,
              ["<", ["to-number", ["get", "adult_height"]], 6],
              2 / 3,
              1,
            ],
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
          },
          paint: {
            "icon-opacity": 0.3,
          },
        });

        map.addSource("orchard-photo", {
          type: "image",
          url: "drone-clean.png",
          coordinates: [
            [0.0, 1.0],
            [1.0, 1.0],
            [1.0, 0.0],
            [0.0, 0.0],
          ],
        });

        map.addLayer(
          {
            id: "orchard-photo-layer",
            type: "raster",
            source: "orchard-photo",
            paint: {
              "raster-opacity": 0.9,
            },
          },
          "trees",
        );

        loadOrchardTrees();
      });

      async function loadOrchardTrees() {
        const status = document.getElementById("map-status");
        try {
          const response = await fetch("/api/trees.geojson");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const orchard = await response.json();
          map.getSource("orchard").setData(orchard);
          status.hidden = true;
        } catch (error) {
          console.error("Could not load orchard trees", error);
          status.textContent = "Could not load orchard trees. Try reloading the page.";
        }
      }

      // ===== Date range filter =====
      const dateMinSlider = document.getElementById("date-min");
      const dateMaxSlider = document.getElementById("date-max");
      const dateLabel = document.getElementById("date-label");
      const dateFilterEnabled = document.getElementById("date-filter-enabled");

      const minDate = new Date("2021-04-01");
      const maxDate = new Date("2024-12-31");
      const totalDays = (maxDate - minDate) / (1000 * 60 * 60 * 24);

      function daysToDate(days) {
        const d = new Date(minDate);
        d.setDate(d.getDate() + Number(days));
        return d;
      }

      function formatDate(d) {
        return d.toISOString().slice(0, 10);
      }

      function applyDateFilter() {
        if (!dateFilterEnabled.checked) {
          map.setFilter("trees", null);
          dateLabel.textContent = "All dates";
          dateMinSlider.disabled = true;
          dateMaxSlider.disabled = true;
          return;
        }

        dateMinSlider.disabled = false;
        dateMaxSlider.disabled = false;

        let minVal = Number(dateMinSlider.value);
        let maxVal = Number(dateMaxSlider.value);

        if (minVal > maxVal) {
          [minVal, maxVal] = [maxVal, minVal];
          dateMinSlider.value = minVal;
          dateMaxSlider.value = maxVal;
        }

        const from = daysToDate(minVal);
        const to = daysToDate(maxVal);

        dateLabel.textContent = `${formatDate(from)} → ${formatDate(to)}`;

        map.setFilter("trees", [
          "all",
          [">=", ["get", "planted_on"], formatDate(from)],
          ["<=", ["get", "planted_on"], formatDate(to)],
        ]);
      }

      dateMinSlider.addEventListener("input", applyDateFilter);
      dateMaxSlider.addEventListener("input", applyDateFilter);
      dateFilterEnabled.addEventListener("change", applyDateFilter);

      // Init
      dateMinSlider.max = totalDays;
      dateMaxSlider.max = totalDays;
      dateMaxSlider.value = totalDays;
      applyDateFilter();
    </script>
  </body>
</html>
