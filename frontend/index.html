<!doctype html>
<html>
  <head>
    <title>Orchard</title>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
      #map-status {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        font: 600 13px sans-serif;
        padding: 8px 12px;
        z-index: 10;
      }
      #map-status[hidden] {
        display: none;
      }
      .tree-editor {
        min-width: 190px;
        font: 13px sans-serif;
      }
      .tree-editor-title {
        font-weight: 700;
        margin-bottom: 10px;
      }
      .tree-editor-field {
        align-items: center;
        display: flex;
        gap: 7px;
      }
      .tree-editor-field + .tree-editor-field {
        margin-top: 7px;
      }
      .tree-editor-note,
      .tree-editor-error {
        font-size: 12px;
        margin-top: 8px;
      }
      .tree-editor-note {
        color: #555;
      }
      .tree-editor-error {
        color: #b42318;
      }
      .tree-editor-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .tree-editor-actions button {
        border: 1px solid #777;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 5px 10px;
      }
      .tree-editor-actions button[type="submit"] {
        background: #245c2a;
        border-color: #245c2a;
        color: white;
      }
      .tree-editor-actions button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      #inventory-toggle {
        position: absolute;
        left: 20px;
        top: 20px;
        z-index: 10;
      }
      .inventory-button {
        background: #245c2a;
        border: 1px solid #245c2a;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font: 600 13px sans-serif;
        padding: 8px 12px;
      }
      #inventory-panel {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 10px;
        bottom: 20px;
        box-shadow: 0 3px 16px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        left: 20px;
        max-width: calc(100vw - 40px);
        padding: 16px;
        position: absolute;
        top: 20px;
        width: 760px;
        z-index: 20;
      }
      #inventory-panel[hidden],
      .inventory-view[hidden] {
        display: none;
      }
      .inventory-header,
      .inventory-tabs,
      .inventory-filters,
      .inventory-result-summary {
        flex: 0 0 auto;
      }
      .inventory-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .inventory-header h2 {
        font-size: 19px;
        margin: 0;
      }
      .inventory-close {
        background: transparent;
        border: 0;
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
        padding: 2px 5px;
      }
      .inventory-tabs {
        border-bottom: 1px solid #ccc;
        display: flex;
        gap: 4px;
        margin-top: 12px;
      }
      .inventory-tab {
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font: 600 13px sans-serif;
        padding: 8px 12px 7px;
      }
      .inventory-tab[aria-selected="true"] {
        border-bottom-color: #245c2a;
        color: #245c2a;
      }
      .inventory-view {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
      }
      .inventory-filters {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 12px;
      }
      .inventory-filters label {
        color: #333;
        font-size: 12px;
        font-weight: 600;
      }
      .inventory-filters select {
        background: white;
        border: 1px solid #999;
        border-radius: 4px;
        box-sizing: border-box;
        display: block;
        font: 13px sans-serif;
        margin-top: 4px;
        padding: 6px;
        width: 100%;
      }
      .inventory-result-summary {
        color: #555;
        font-size: 12px;
        margin: 10px 0 7px;
      }
      .inventory-table-wrap {
        border: 1px solid #d5d5d5;
        border-radius: 5px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .inventory-table {
        border-collapse: collapse;
        font-size: 13px;
        width: 100%;
      }
      .inventory-table th,
      .inventory-table td {
        border-bottom: 1px solid #e2e2e2;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      .inventory-table th {
        background: #f2f5f1;
        position: sticky;
        top: 0;
        white-space: nowrap;
        z-index: 1;
      }
      .inventory-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .inventory-table .inventory-number {
        text-align: right;
      }
      .inventory-empty {
        color: #666;
        text-align: center !important;
      }
      #species-inventory .inventory-result-summary {
        margin-top: 12px;
      }
      .inventory-cultivars {
        margin-top: 6px;
      }
      .inventory-cultivars summary {
        color: #245c2a;
        cursor: pointer;
        font-size: 12px;
      }
      .inventory-cultivars ul {
        margin: 5px 0 0;
        padding-left: 20px;
      }
      .harvest-editor {
        display: grid;
        gap: 6px;
        min-width: 150px;
      }
      .harvest-editor label {
        display: grid;
        font-size: 11px;
        gap: 2px;
      }
      .harvest-editor input {
        border: 1px solid #999;
        border-radius: 4px;
        font: inherit;
        padding: 4px 5px;
        width: 72px;
      }
      .harvest-editor-actions {
        display: flex;
        gap: 5px;
      }
      .harvest-edit-button,
      .harvest-editor button {
        border: 1px solid #777;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 3px 7px;
      }
      .harvest-edit-button {
        margin-left: 7px;
      }
      .harvest-editor-error {
        color: #b42318;
        font-size: 11px;
      }
      .harvest-map-control {
        border-bottom: 1px solid #ddd;
        margin-bottom: 12px;
        padding-bottom: 12px;
      }
      .harvest-map-control-title {
        align-items: center;
        display: flex;
        font-weight: 600;
        gap: 8px;
      }
      .harvest-map-control label:not(.harvest-map-control-title) {
        display: block;
        font-size: 12px;
        margin-top: 8px;
      }
      .harvest-map-control input[type="range"] {
        display: block;
        width: 100%;
      }
      #harvest-window-label {
        color: #444;
        font-size: 13px;
        margin-top: 7px;
      }
      @media (max-width: 620px) {
        #inventory-toggle {
          left: 10px;
          top: 10px;
        }
        #inventory-panel {
          bottom: 10px;
          left: 10px;
          max-width: calc(100vw - 20px);
          padding: 12px;
          top: 10px;
          width: calc(100vw - 20px);
        }
        .inventory-filters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="map-status">Loading orchard trees…</div>
    <button
      id="inventory-toggle"
      class="inventory-button"
      type="button"
      aria-controls="inventory-panel"
      aria-expanded="false"
    >
      Tree inventory
    </button>
    <aside id="inventory-panel" aria-labelledby="inventory-title" hidden>
      <header class="inventory-header">
        <h2 id="inventory-title">Orchard inventory</h2>
        <button
          id="inventory-close"
          class="inventory-close"
          type="button"
          aria-label="Close inventory"
        >
          ×
        </button>
      </header>
      <div class="inventory-tabs" role="tablist" aria-label="Inventory views">
        <button
          id="trees-tab"
          class="inventory-tab"
          type="button"
          role="tab"
          aria-controls="tree-inventory"
          aria-selected="true"
        >
          Trees
        </button>
        <button
          id="species-tab"
          class="inventory-tab"
          type="button"
          role="tab"
          aria-controls="species-inventory"
          aria-selected="false"
        >
          Species planted
        </button>
      </div>
      <section
        id="tree-inventory"
        class="inventory-view"
        role="tabpanel"
        aria-labelledby="trees-tab"
      >
        <div class="inventory-filters">
          <label>
            Role
            <select id="inventory-role-filter">
              <option value="">All roles</option>
              <option value="fruit">Fruit</option>
              <option value="pioneer">Pioneer</option>
            </select>
          </label>
          <label>
            Genus
            <select id="inventory-genus-filter">
              <option value="">All genera</option>
            </select>
          </label>
          <label>
            Species
            <select id="inventory-species-filter">
              <option value="">All species</option>
            </select>
          </label>
        </div>
        <div id="tree-result-summary" class="inventory-result-summary">
          0 trees
        </div>
        <div class="inventory-table-wrap">
          <table class="inventory-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Botanical identity</th>
                <th scope="col">Roles</th>
                <th scope="col">Planted</th>
                <th scope="col">Condition</th>
              </tr>
            </thead>
            <tbody id="tree-inventory-body"></tbody>
          </table>
        </div>
      </section>
      <section
        id="species-inventory"
        class="inventory-view"
        role="tabpanel"
        aria-labelledby="species-tab"
        hidden
      >
        <div id="identity-result-summary" class="inventory-result-summary">
          0 planted species
        </div>
        <div class="inventory-table-wrap">
          <table class="inventory-table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Botanical identity</th>
                <th scope="col" class="inventory-number">Trees</th>
                <th scope="col">Harvest</th>
              </tr>
            </thead>
            <tbody id="identity-inventory-body"></tbody>
          </table>
        </div>
      </section>
    </aside>
    <div
      id="date-filter"
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        background: white;
        padding: 12px 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        z-index: 10;
        font-family: sans-serif;
        width: 280px;
      "
    >
      <section class="harvest-map-control" aria-label="Harvest availability">
        <label class="harvest-map-control-title">
          <input type="checkbox" id="harvest-filter-enabled" checked />
          Fruit available
        </label>
        <div id="harvest-window-label">This week</div>
        <label>
          Start: <span id="harvest-offset-label">this week</span>
          <input type="range" id="harvest-offset" min="0" max="52" value="0" />
        </label>
        <label>
          Width: <span id="harvest-weeks-label">1 week</span>
          <input type="range" id="harvest-weeks" min="1" max="12" value="1" />
        </label>
      </section>
      <label
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 8px;
          font-weight: 600;
        "
      >
        <input type="checkbox" id="date-filter-enabled" />
        Filter by planting date
      </label>

      <div id="date-label" style="font-size: 13px; margin-bottom: 8px">
        All dates
      </div>

      <input
        type="range"
        id="date-min"
        min="0"
        max="1000"
        value="0"
        style="width: 100%"
      />
      <input
        type="range"
        id="date-max"
        min="0"
        max="1000"
        value="1000"
        style="width: 100%; margin-top: 4px"
      />
    </div>
    <script type="module">
      import {
        filterTreeFeatures,
        summarizeSpecies,
        taxonomyOptions,
      } from "./orchard-inventory.mjs";
      import {
        harvestAvailability,
        harvestAvailabilitySummary,
        parseAnnualDate,
      } from "./harvest-window.mjs";

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "ign-ortho": {
              type: "raster",
              tiles: [
                "https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}",
              ],
              tileSize: 256,
              attribution: "© IGN",
            },
            orchard: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
          },
          layers: [
            {
              id: "ign-ortho",
              type: "raster",
              source: "ign-ortho",
            },
            {
              id: "trees",
              type: "circle",
              source: "orchard",
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  3,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  6,
                  9,
                ],
                "circle-color": [
                  "match",
                  ["get", "row_name"],
                  "1. Haut haut haut",
                  "#eeeeee",
                  "2. Haut haut",
                  "#3cb44b",
                  "3. Haut",
                  "#ffe119",
                  "4. Milieu haut",
                  "#4363d8",
                  "5. Milieu bas",
                  "#f58231",
                  "6. Milieu bas bas",
                  "#911eb4",
                  "7. Bas haut",
                  "#46f0f0",
                  "8. Bas",
                  "#f032e6",
                  "9. Bas bas",
                  "#bcf60c",
                  "10. Bas bas bas",
                  "#fabebe",
                  "11. Entrée",
                  "#008080",
                  "12. Entrée centre",
                  "#e6beff",
                  "13. Côté bambous",
                  "#9a6324",
                  "#808080",
                ],
                "circle-stroke-width": [
                  "case",
                  ["in", "pioneer", ["get", "roles"]],
                  2,
                  1,
                ],
                "circle-stroke-color": [
                  "case",
                  ["in", "pioneer", ["get", "roles"]],
                  "#000000",
                  "#ffffff",
                ],
                "circle-opacity": [
                  "case",
                  ["==", ["get", "is_alive"], false],
                  0.3,
                  1,
                ],
                "circle-stroke-opacity": [
                  "case",
                  ["==", ["get", "is_alive"], false],
                  0.3,
                  1,
                ],
              },
            },
            {
              id: "harvest-rings",
              type: "circle",
              source: "orchard",
              filter: ["==", ["get", "harvest_available"], true],
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  8,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  11,
                  14,
                ],
                "circle-color": "rgba(255, 191, 0, 0.18)",
                "circle-stroke-color": "#ffb000",
                "circle-stroke-opacity": 1,
                "circle-stroke-width": 4,
              },
            },
            {
              id: "danger-rings",
              type: "circle",
              source: "orchard",
              filter: ["==", ["get", "is_in_danger"], true],
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  7,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  10,
                  13,
                ],
                "circle-color": "rgba(0, 0, 0, 0)",
                "circle-stroke-color": "#d40000",
                "circle-stroke-opacity": 0.95,
                "circle-stroke-width": 3,
              },
            },
          ],
        },
        maxZoom: 24,
      });

      let treeTooltip;
      let treeEditor;
      let orchardFeatures = [];
      const inventoryToggle = document.getElementById("inventory-toggle");
      const inventoryPanel = document.getElementById("inventory-panel");
      const inventoryClose = document.getElementById("inventory-close");
      const treesTab = document.getElementById("trees-tab");
      const speciesTab = document.getElementById("species-tab");
      const treeInventory = document.getElementById("tree-inventory");
      const speciesInventory = document.getElementById("species-inventory");
      const roleFilter = document.getElementById("inventory-role-filter");
      const genusFilter = document.getElementById("inventory-genus-filter");
      const speciesFilter = document.getElementById("inventory-species-filter");
      const treeResultSummary = document.getElementById("tree-result-summary");
      const identityResultSummary = document.getElementById(
        "identity-result-summary",
      );
      const treeInventoryBody = document.getElementById("tree-inventory-body");
      const identityInventoryBody = document.getElementById(
        "identity-inventory-body",
      );
      const harvestFilterEnabled = document.getElementById(
        "harvest-filter-enabled",
      );
      const harvestOffset = document.getElementById("harvest-offset");
      const harvestWeeks = document.getElementById("harvest-weeks");
      const harvestOffsetLabel = document.getElementById(
        "harvest-offset-label",
      );
      const harvestWeeksLabel = document.getElementById(
        "harvest-weeks-label",
      );
      const harvestWindowLabel = document.getElementById(
        "harvest-window-label",
      );

      function createDeadTreeCrossImage() {
        const size = 18;
        const pixels = new Uint8Array(size * size * 4);

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const isCross =
              Math.abs(x - y) <= 1 || Math.abs(size - 1 - x - y) <= 1;
            if (!isCross) continue;

            const offset = (y * size + x) * 4;
            pixels[offset + 3] = 255;
          }
        }

        return { width: size, height: size, data: pixels };
      }

      function createTreeTooltip(properties) {
        const tooltip = document.createElement("div");

        [
          ["Name", properties.name],
          ["Latin name", properties.latin_name],
          ["Date", properties.planted_on],
        ].forEach(([label, value]) => {
          if (value == null || value === "") return;

          const field = document.createElement("div");
          const labelElement = document.createElement("strong");
          labelElement.textContent = `${label}: `;
          field.append(labelElement, document.createTextNode(value));
          tooltip.append(field);
        });

        return tooltip;
      }

      function closeTreeEditor() {
        treeEditor?.remove();
        treeEditor = undefined;
      }

      function createTreeEditor(feature) {
        const form = document.createElement("form");
        form.className = "tree-editor";
        const originalIsAlive = feature.properties.is_alive !== false;
        const originalIsInDanger = feature.properties.is_in_danger === true;

        const title = document.createElement("div");
        title.className = "tree-editor-title";
        title.textContent = feature.properties.name || "Tree";

        const dangerField = document.createElement("label");
        dangerField.className = "tree-editor-field";
        const dangerCheckbox = document.createElement("input");
        dangerCheckbox.type = "checkbox";
        dangerCheckbox.checked = originalIsInDanger;
        dangerField.append(
          dangerCheckbox,
          document.createTextNode("In danger"),
        );

        const deadField = document.createElement("label");
        deadField.className = "tree-editor-field";
        const deadCheckbox = document.createElement("input");
        deadCheckbox.type = "checkbox";
        deadCheckbox.checked = !originalIsAlive;
        deadField.append(deadCheckbox, document.createTextNode("Dead"));

        const note = document.createElement("div");
        note.className = "tree-editor-note";
        note.textContent = "A dead tree cannot be in danger.";

        function syncConditionControls() {
          if (deadCheckbox.checked) dangerCheckbox.checked = false;
          dangerCheckbox.disabled = deadCheckbox.checked;
          note.hidden = !deadCheckbox.checked;
        }

        deadCheckbox.addEventListener("change", syncConditionControls);
        syncConditionControls();

        const error = document.createElement("div");
        error.className = "tree-editor-error";
        error.setAttribute("aria-live", "polite");
        error.hidden = true;

        const actions = document.createElement("div");
        actions.className = "tree-editor-actions";
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.textContent = "Cancel";
        cancelButton.addEventListener("click", closeTreeEditor);
        const saveButton = document.createElement("button");
        saveButton.type = "submit";
        saveButton.textContent = "OK";
        actions.append(cancelButton, saveButton);

        form.append(title, dangerField, deadField, note);
        form.append(error, actions);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          error.hidden = true;
          dangerCheckbox.disabled = true;
          deadCheckbox.disabled = true;
          cancelButton.disabled = true;
          saveButton.disabled = true;
          saveButton.textContent = "Saving…";

          try {
            const isAlive = !deadCheckbox.checked;
            const changes = {};
            if (isAlive !== originalIsAlive) {
              changes.is_alive = isAlive;
            }
            if (
              isAlive &&
              dangerCheckbox.checked !== originalIsInDanger
            ) {
              changes.is_in_danger = dangerCheckbox.checked;
            }
            if (Object.keys(changes).length > 0) {
              await updateTree(feature.id, changes);
            }
            closeTreeEditor();
            if (Object.keys(changes).length > 0) await loadOrchardTrees();
          } catch (requestError) {
            error.textContent = requestError.message;
            error.hidden = false;
            deadCheckbox.disabled = false;
            syncConditionControls();
            cancelButton.disabled = false;
            saveButton.disabled = false;
            saveButton.textContent = "OK";
          }
        });

        return form;
      }

      async function updateTree(treeId, changes) {
        if (treeId == null) throw new Error("This tree has no editable ID.");

        const response = await fetch(`/api/trees/${encodeURIComponent(treeId)}`, {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(changes),
        });
        if (response.ok) return;
        if (response.status === 404) {
          throw new Error("This tree no longer exists.");
        }
        if (response.status === 409) {
          throw new Error("A dead tree cannot be marked as in danger.");
        }
        throw new Error("Could not update this tree. Please try again.");
      }

      function setInventoryOpen(isOpen) {
        inventoryPanel.hidden = !isOpen;
        inventoryToggle.hidden = isOpen;
        inventoryToggle.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) inventoryClose.focus();
      }

      function selectInventoryView(view) {
        const showsTrees = view === "trees";
        treesTab.setAttribute("aria-selected", String(showsTrees));
        speciesTab.setAttribute("aria-selected", String(!showsTrees));
        treeInventory.hidden = !showsTrees;
        speciesInventory.hidden = showsTrees;
      }

      function setSelectOptions(select, values, allLabel) {
        const previousValue = select.value;
        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = allLabel;
        const options = values.map((value) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          return option;
        });
        select.replaceChildren(allOption, ...options);
        select.value = values.includes(previousValue) ? previousValue : "";
      }

      function refreshTaxonomyFilters() {
        const { genera } = taxonomyOptions(orchardFeatures);
        setSelectOptions(genusFilter, genera, "All genera");
        refreshSpeciesFilter();
      }

      function refreshSpeciesFilter() {
        const { species } = taxonomyOptions(orchardFeatures, genusFilter.value);
        setSelectOptions(speciesFilter, species, "All species");
      }

      function renderInventory() {
        renderTreeInventory();
        renderSpeciesInventory();
      }

      function renderTreeInventory() {
        const filteredTrees = filterTreeFeatures(orchardFeatures, {
          role: roleFilter.value,
          genus: genusFilter.value,
          species: speciesFilter.value,
        });
        treeResultSummary.textContent = `${filteredTrees.length} of ${orchardFeatures.length} trees`;
        const rows = filteredTrees.map((feature) => {
          const properties = feature.properties || {};
          const row = document.createElement("tr");
          appendCell(row, feature.id);
          appendCell(row, properties.name);
          appendCell(row, properties.latin_name);
          appendCell(row, (properties.roles || []).join(", "));
          appendCell(row, properties.planted_on);
          appendCell(row, treeCondition(properties));
          return row;
        });
        treeInventoryBody.replaceChildren(...rows);
        if (rows.length === 0) {
          treeInventoryBody.append(emptyRow("No trees match these filters.", 6));
        }
      }

      function renderSpeciesInventory() {
        const species = summarizeSpecies(orchardFeatures);
        identityResultSummary.textContent = `${species.length} planted species · ${orchardFeatures.length} trees`;
        const rows = species.map((speciesSummary) => {
          const row = document.createElement("tr");
          appendCell(row, speciesSummary.names.join(" / "));
          appendSpeciesCell(row, speciesSummary);
          appendCell(row, speciesSummary.count, "inventory-number");
          appendHarvestCell(row, speciesSummary);
          return row;
        });
        identityInventoryBody.replaceChildren(...rows);
        if (rows.length === 0) {
          identityInventoryBody.append(
            emptyRow("No planted species yet.", 4),
          );
        }
      }

      function appendSpeciesCell(row, speciesSummary) {
        const cell = document.createElement("td");
        const taxonName = document.createElement("div");
        taxonName.textContent = speciesSummary.taxonName;
        cell.append(taxonName);

        if (speciesSummary.cultivars.length > 0) {
          const details = document.createElement("details");
          details.className = "inventory-cultivars";
          const summary = document.createElement("summary");
          const cultivarCount = speciesSummary.cultivars.length;
          summary.textContent = `${cultivarCount} cultivar${cultivarCount === 1 ? "" : "s"}`;
          const list = document.createElement("ul");
          speciesSummary.cultivars.forEach((cultivar) => {
            const item = document.createElement("li");
            item.textContent = `${cultivar.name} — ${cultivar.count}`;
            list.append(item);
          });
          details.append(summary, list);
          cell.append(details);
        }

        row.append(cell);
      }

      function appendHarvestCell(row, speciesSummary) {
        const cell = document.createElement("td");
        const value = document.createElement("span");
        value.textContent =
          speciesSummary.harvestStart && speciesSummary.harvestEnd
            ? `${speciesSummary.harvestStart} → ${speciesSummary.harvestEnd}`
            : "Not set";
        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "harvest-edit-button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => {
          showHarvestEditor(cell, speciesSummary);
        });
        cell.append(value, editButton);
        row.append(cell);
      }

      function showHarvestEditor(cell, speciesSummary) {
        const form = document.createElement("form");
        form.className = "harvest-editor";
        const startInput = annualDateInput(
          "Start (MM-DD)",
          speciesSummary.harvestStart,
        );
        const endInput = annualDateInput(
          "End (MM-DD)",
          speciesSummary.harvestEnd,
        );
        const error = document.createElement("div");
        error.className = "harvest-editor-error";
        error.hidden = true;
        error.setAttribute("aria-live", "polite");
        const actions = document.createElement("div");
        actions.className = "harvest-editor-actions";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", renderSpeciesInventory);
        const save = document.createElement("button");
        save.type = "submit";
        save.textContent = "OK";
        actions.append(cancel, save);
        form.append(startInput.label, endInput.label, error, actions);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const harvestStart = parseAnnualDate(startInput.input.value);
          const harvestEnd = parseAnnualDate(endInput.input.value);
          if (!harvestStart || !harvestEnd) {
            error.textContent = "Use a valid MM-DD date, for example 08-30.";
            error.hidden = false;
            return;
          }
          error.hidden = true;
          startInput.input.disabled = true;
          endInput.input.disabled = true;
          cancel.disabled = true;
          save.disabled = true;
          save.textContent = "Saving…";
          try {
            await updatePlantIdentityHarvestWindow(
              speciesSummary.plantIdentityId,
              harvestStart,
              harvestEnd,
            );
            await loadOrchardTrees();
          } catch (requestError) {
            error.textContent = requestError.message;
            error.hidden = false;
            startInput.input.disabled = false;
            endInput.input.disabled = false;
            cancel.disabled = false;
            save.disabled = false;
            save.textContent = "OK";
          }
        });

        cell.replaceChildren(form);
        startInput.input.focus();
      }

      function annualDateInput(text, value) {
        const label = document.createElement("label");
        label.append(document.createTextNode(text));
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "numeric";
        input.placeholder = "MM-DD";
        input.maxLength = 5;
        input.value = value || "";
        label.append(input);
        return { label, input };
      }

      async function updatePlantIdentityHarvestWindow(
        plantIdentityId,
        harvestStart,
        harvestEnd,
      ) {
        if (plantIdentityId == null) {
          throw new Error("This plant identity has no editable ID.");
        }
        const response = await fetch(
          `/api/plant-identities/${encodeURIComponent(plantIdentityId)}`,
          {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              harvest_start: harvestStart,
              harvest_end: harvestEnd,
            }),
          },
        );
        if (response.ok) return;
        if (response.status === 400) {
          throw new Error("The harvest dates are invalid.");
        }
        if (response.status === 404) {
          throw new Error("This plant identity no longer exists.");
        }
        throw new Error("Could not update the harvest dates. Please try again.");
      }

      function appendCell(row, value, className) {
        const cell = document.createElement("td");
        if (className) cell.className = className;
        cell.textContent = value == null || value === "" ? "—" : String(value);
        row.append(cell);
      }

      function emptyRow(message, columnCount) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.className = "inventory-empty";
        cell.colSpan = columnCount;
        cell.textContent = message;
        row.append(cell);
        return row;
      }

      function treeCondition(properties) {
        if (properties.is_alive === false) return "Dead";
        if (properties.is_in_danger === true) return "In danger";
        return "Healthy";
      }

      map.on("mouseenter", "trees", (event) => {
        map.getCanvas().style.cursor = "pointer";
        if (treeEditor) return;

        const feature = event.features[0];
        treeTooltip?.remove();
        treeTooltip = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 10,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(createTreeTooltip(feature.properties))
          .addTo(map);
      });

      map.on("mouseleave", "trees", () => {
        map.getCanvas().style.cursor = "";
        treeTooltip?.remove();
        treeTooltip = undefined;
      });

      map.on("click", "trees", (event) => {
        const feature = event.features[0];
        treeTooltip?.remove();
        treeTooltip = undefined;
        closeTreeEditor();

        const popup = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 12,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(createTreeEditor(feature))
          .addTo(map);
        treeEditor = popup;
        popup.on("close", () => {
          if (treeEditor === popup) treeEditor = undefined;
        });
      });

      map.on("load", () => {
        map.addImage("dead-tree-cross", createDeadTreeCrossImage());
        map.addLayer({
          id: "dead-tree-crosses",
          type: "symbol",
          source: "orchard",
          filter: ["==", ["get", "is_alive"], false],
          layout: {
            "icon-image": "dead-tree-cross",
            "icon-size": [
              "case",
              ["<", ["to-number", ["get", "adult_height"]], 1.4],
              1 / 3,
              ["<", ["to-number", ["get", "adult_height"]], 6],
              2 / 3,
              1,
            ],
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
          },
          paint: {
            "icon-opacity": 0.3,
          },
        });

        applyDateFilter();
        initializeMap();
      });

      async function initializeMap() {
        const status = document.getElementById("map-status");
        try {
          await loadMapConfiguration();
          await fetchOrchardTrees();
          status.hidden = true;
        } catch (error) {
          console.error("Could not initialize the orchard map", error);
          status.textContent = "Could not load the orchard map. Try reloading the page.";
        }
      }

      async function loadMapConfiguration() {
        const response = await fetch("/api/map-config");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const configuration = await response.json();

        map.jumpTo({ center: configuration.default_center, zoom: 20 });
        configuration.aerial_overlays.forEach((overlay) => {
          const sourceId = `aerial-overlay-${overlay.id}`;
          map.addSource(sourceId, {
            type: "image",
            url: `/api/aerial-overlays/${encodeURIComponent(overlay.id)}/image`,
            coordinates: overlay.coordinates,
          });
          map.addLayer(
            {
              id: `${sourceId}-layer`,
              type: "raster",
              source: sourceId,
              paint: { "raster-opacity": 0.9 },
            },
            "trees",
          );
        });
      }

      async function fetchOrchardTrees() {
        const response = await fetch("/api/trees.geojson");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const orchard = await response.json();
        orchardFeatures = orchard.features || [];
        applyHarvestWindow();
        refreshTaxonomyFilters();
        renderInventory();
      }

      async function loadOrchardTrees() {
        const status = document.getElementById("map-status");
        try {
          await fetchOrchardTrees();
          status.hidden = true;
        } catch (error) {
          console.error("Could not load orchard trees", error);
          status.textContent = "Could not load orchard trees. Try reloading the page.";
          status.hidden = false;
        }
      }

      function applyHarvestWindow() {
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const offset = Number(harvestOffset.value);
        const weeks = Number(harvestWeeks.value);
        start.setDate(start.getDate() + offset * 7);
        const end = new Date(start);
        end.setDate(end.getDate() + weeks * 7 - 1);

        harvestOffsetLabel.textContent =
          offset === 0
            ? "this week"
            : `in ${offset} week${offset === 1 ? "" : "s"}`;
        harvestWeeksLabel.textContent = `${weeks} week${weeks === 1 ? "" : "s"}`;

        const visibleFeatures = harvestAvailability(
          orchardFeatures,
          start,
          weeks,
        );
        const summary = harvestAvailabilitySummary(visibleFeatures);
        const dateFormatter = new Intl.DateTimeFormat(undefined, {
          day: "numeric",
          month: "short",
        });
        harvestWindowLabel.textContent = harvestFilterEnabled.checked
          ? `${dateFormatter.format(start)} → ${dateFormatter.format(end)} · ${summary.trees} tree${summary.trees === 1 ? "" : "s"} · ${summary.species} species`
          : "Harvest display hidden";

        const source = map.getSource("orchard");
        if (source) {
          source.setData({
            type: "FeatureCollection",
            features: visibleFeatures,
          });
        }
        if (map.getLayer("harvest-rings")) {
          map.setLayoutProperty(
            "harvest-rings",
            "visibility",
            harvestFilterEnabled.checked ? "visible" : "none",
          );
        }
      }

      // ===== Date range filter =====
      const dateMinSlider = document.getElementById("date-min");
      const dateMaxSlider = document.getElementById("date-max");
      const dateLabel = document.getElementById("date-label");
      const dateFilterEnabled = document.getElementById("date-filter-enabled");

      const minDate = new Date("2021-04-01");
      const maxDate = new Date("2024-12-31");
      const totalDays = (maxDate - minDate) / (1000 * 60 * 60 * 24);

      function daysToDate(days) {
        const d = new Date(minDate);
        d.setDate(d.getDate() + Number(days));
        return d;
      }

      function formatDate(d) {
        return d.toISOString().slice(0, 10);
      }

      function applyDateFilter() {
        if (!dateFilterEnabled.checked) {
          if (map.isStyleLoaded()) map.setFilter("trees", null);
          dateLabel.textContent = "All dates";
          dateMinSlider.disabled = true;
          dateMaxSlider.disabled = true;
          return;
        }

        dateMinSlider.disabled = false;
        dateMaxSlider.disabled = false;

        let minVal = Number(dateMinSlider.value);
        let maxVal = Number(dateMaxSlider.value);

        if (minVal > maxVal) {
          [minVal, maxVal] = [maxVal, minVal];
          dateMinSlider.value = minVal;
          dateMaxSlider.value = maxVal;
        }

        const from = daysToDate(minVal);
        const to = daysToDate(maxVal);

        dateLabel.textContent = `${formatDate(from)} → ${formatDate(to)}`;

        if (map.isStyleLoaded()) {
          map.setFilter("trees", [
            "all",
            [">=", ["get", "planted_on"], formatDate(from)],
            ["<=", ["get", "planted_on"], formatDate(to)],
          ]);
        }
      }

      dateMinSlider.addEventListener("input", applyDateFilter);
      dateMaxSlider.addEventListener("input", applyDateFilter);
      dateFilterEnabled.addEventListener("change", applyDateFilter);
      harvestFilterEnabled.addEventListener("change", applyHarvestWindow);
      harvestOffset.addEventListener("input", applyHarvestWindow);
      harvestWeeks.addEventListener("input", applyHarvestWindow);

      inventoryToggle.addEventListener("click", () => setInventoryOpen(true));
      inventoryClose.addEventListener("click", () => setInventoryOpen(false));
      treesTab.addEventListener("click", () => selectInventoryView("trees"));
      speciesTab.addEventListener("click", () =>
        selectInventoryView("species"),
      );
      roleFilter.addEventListener("change", renderTreeInventory);
      speciesFilter.addEventListener("change", renderTreeInventory);
      genusFilter.addEventListener("change", () => {
        refreshSpeciesFilter();
        renderTreeInventory();
      });

      // Init
      dateMinSlider.max = totalDays;
      dateMaxSlider.max = totalDays;
      dateMaxSlider.value = totalDays;
      applyDateFilter();
      applyHarvestWindow();
    </script>
  </body>
</html>
