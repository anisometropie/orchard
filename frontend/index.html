<!doctype html>
<html>
  <head>
    <title>Orchard</title>
    <meta charset="utf-8" />
    <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
      }
      .visually-hidden {
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        height: 1px;
        overflow: hidden;
        position: absolute;
        white-space: nowrap;
        width: 1px;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
      #map-status {
        position: absolute;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        font: 600 13px sans-serif;
        padding: 8px 12px;
        z-index: 10;
      }
      #map-status[hidden] {
        display: none;
      }
      .tree-editor {
        min-width: 190px;
        font: 13px sans-serif;
      }
      .tree-editor-title {
        font-weight: 700;
        margin-bottom: 10px;
      }
      .tree-editor-field {
        align-items: center;
        display: flex;
        gap: 7px;
      }
      .tree-editor-field + .tree-editor-field {
        margin-top: 7px;
      }
      .tree-editor-note,
      .tree-editor-error {
        font-size: 12px;
        margin-top: 8px;
      }
      .tree-editor-note {
        color: #555;
      }
      .tree-editor-error {
        color: #b42318;
      }
      .tree-editor-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .tree-editor-actions button {
        border: 1px solid #777;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 5px 10px;
      }
      .tree-editor-actions button[type="submit"] {
        background: #245c2a;
        border-color: #245c2a;
        color: white;
      }
      .tree-editor-actions button:disabled {
        cursor: wait;
        opacity: 0.6;
      }
      #map-toolbar {
        align-items: center;
        display: flex;
        gap: 8px;
        position: absolute;
        left: 20px;
        top: 20px;
        z-index: 10;
      }
      #map-toolbar[hidden] {
        display: none;
      }
      #access-panel {
        align-items: center;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-wrap: wrap;
        font: 600 13px sans-serif;
        gap: 7px;
        max-width: min(560px, calc(100vw - 40px));
        padding: 8px;
        position: absolute;
        right: 20px;
        top: 20px;
        z-index: 30;
      }
      #access-panel button,
      #access-panel input,
      #access-panel select {
        border: 1px solid #777;
        border-radius: 5px;
        box-sizing: border-box;
        font: inherit;
        padding: 6px 8px;
      }
      #access-panel button {
        background: #245c2a;
        border-color: #245c2a;
        color: white;
        cursor: pointer;
      }
      #access-panel button.secondary {
        background: white;
        border-color: #777;
        color: #333;
      }
      #login-form {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #login-form[hidden],
      #share-result[hidden] {
        display: none;
      }
      #login-error {
        color: #b42318;
        flex-basis: 100%;
        font-size: 12px;
      }
      #share-result {
        display: flex;
        flex-basis: 100%;
        gap: 6px;
      }
      #share-link {
        flex: 1;
        min-width: 220px;
      }
      #access-mode {
        color: #555;
        white-space: nowrap;
      }
      .inventory-button {
        background: #245c2a;
        border: 1px solid #245c2a;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font: 600 13px sans-serif;
        padding: 8px 12px;
      }
      .map-mode-switch {
        display: flex;
        gap: 4px;
      }
      .map-mode-button {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #777;
        border-radius: 6px;
        color: #333;
        cursor: pointer;
        font: 600 13px sans-serif;
        padding: 8px 12px;
      }
      .map-mode-button[aria-pressed="true"] {
        background: #245c2a;
        border-color: #245c2a;
        color: white;
      }
      .map-mode-button[data-map-mode="danger"][aria-pressed="true"] {
        background: #b42318;
        border-color: #8f1d14;
      }
      #inventory-panel {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 10px;
        bottom: 20px;
        box-shadow: 0 3px 16px rgba(0, 0, 0, 0.3);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        left: 20px;
        max-width: calc(100vw - 40px);
        padding: 16px;
        position: absolute;
        top: 20px;
        width: 760px;
        z-index: 20;
      }
      #inventory-panel[hidden],
      .inventory-view[hidden] {
        display: none;
      }
      .inventory-header,
      .inventory-tabs,
      .inventory-filters,
      .inventory-result-summary {
        flex: 0 0 auto;
      }
      .inventory-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .inventory-header h2 {
        font-size: 19px;
        margin: 0;
      }
      .inventory-close {
        background: transparent;
        border: 0;
        cursor: pointer;
        font-size: 24px;
        line-height: 1;
        padding: 2px 5px;
      }
      .inventory-tabs {
        border-bottom: 1px solid #ccc;
        display: flex;
        gap: 4px;
        margin-top: 12px;
      }
      .inventory-tab {
        background: transparent;
        border: 0;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font: 600 13px sans-serif;
        padding: 8px 12px 7px;
      }
      .inventory-tab[aria-selected="true"] {
        border-bottom-color: #245c2a;
        color: #245c2a;
      }
      .inventory-view {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
      }
      .inventory-filters {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 12px;
      }
      .inventory-filters label {
        color: #333;
        font-size: 12px;
        font-weight: 600;
      }
      .inventory-filters select {
        background: white;
        border: 1px solid #999;
        border-radius: 4px;
        box-sizing: border-box;
        display: block;
        font: 13px sans-serif;
        margin-top: 4px;
        padding: 6px;
        width: 100%;
      }
      .inventory-result-summary {
        color: #555;
        font-size: 12px;
        margin: 10px 0 7px;
      }
      .inventory-table-wrap {
        border: 1px solid #d5d5d5;
        border-radius: 5px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .inventory-table {
        border-collapse: collapse;
        font-size: 13px;
        width: 100%;
      }
      .inventory-table th,
      .inventory-table td {
        border-bottom: 1px solid #e2e2e2;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      .inventory-table th {
        background: #f2f5f1;
        position: sticky;
        top: 0;
        white-space: nowrap;
        z-index: 1;
      }
      .inventory-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .inventory-table .inventory-number {
        text-align: right;
      }
      .inventory-empty {
        color: #666;
        text-align: center !important;
      }
      #species-inventory .inventory-result-summary {
        margin-top: 12px;
      }
      .inventory-cultivars {
        margin-top: 6px;
      }
      .inventory-cultivars summary {
        color: #245c2a;
        cursor: pointer;
        font-size: 12px;
        width: max-content;
      }
      .inventory-species-name {
        font-style: italic;
        font-weight: 600;
      }
      .inventory-species-common-name {
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }
      .inventory-cultivar-list {
        display: none;
        margin-top: 7px;
      }
      .inventory-cultivars[open] .inventory-cultivar-list {
        display: grid;
      }
      .inventory-species-harvest {
        align-items: center;
        display: flex;
        gap: 5px;
        margin-top: 4px;
        width: max-content;
      }
      .harvest-schedule {
        align-items: center;
        border-top: 1px solid #e5e5e5;
        display: grid;
        gap: 5px 10px;
        grid-template-columns: minmax(110px, 1fr) auto minmax(180px, 1.5fr) 24px;
        min-height: 28px;
        padding: 5px 0;
      }
      .harvest-schedule-name {
        font-weight: 600;
      }
      .harvest-schedule-count,
      .harvest-schedule-window {
        color: #555;
        font-size: 12px;
      }
      .harvest-editor {
        display: grid;
        gap: 6px;
        min-width: 150px;
      }
      .harvest-editor label {
        display: grid;
        font-size: 11px;
        gap: 2px;
      }
      .harvest-editor input,
      .harvest-editor select {
        border: 1px solid #999;
        border-radius: 4px;
        font: inherit;
        padding: 4px 5px;
      }
      .harvest-editor input {
        width: 110px;
      }
      .harvest-window-list {
        display: grid;
        gap: 5px;
      }
      .harvest-window-row {
        align-items: end;
        display: flex;
        gap: 5px;
      }
      .harvest-schedule .harvest-editor {
        grid-column: 1 / -1;
      }
      .harvest-editor-actions {
        display: flex;
        gap: 5px;
      }
      .harvest-editor button {
        border: 1px solid #777;
        border-radius: 4px;
        cursor: pointer;
        font: inherit;
        padding: 3px 7px;
      }
      .harvest-edit-button {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 50%;
        color: #245c2a;
        cursor: pointer;
        display: inline-flex;
        font-size: 16px;
        height: 24px;
        justify-content: center;
        opacity: 0;
        padding: 0;
        pointer-events: none;
        transition: background-color 120ms ease, opacity 120ms ease;
        width: 24px;
      }
      .harvest-schedule:hover .harvest-edit-button,
      .harvest-schedule:focus-within .harvest-edit-button,
      .inventory-species-harvest:hover .harvest-edit-button,
      .inventory-species-harvest:focus-within .harvest-edit-button {
        opacity: 1;
        pointer-events: auto;
      }
      .harvest-edit-button:hover,
      .harvest-edit-button:focus-visible {
        background: #e5efe3;
        outline: none;
      }
      .harvest-editor-error {
        color: #b42318;
        font-size: 11px;
      }
      #map-filter-panel {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        box-sizing: border-box;
        font-family: sans-serif;
        max-height: calc(100vh - 92px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px;
        position: absolute;
        right: 20px;
        top: 20px;
        width: 312px;
        z-index: 10;
      }
      #map-filter-panel[hidden],
      .map-mode-filters[hidden] {
        display: none;
      }
      .harvest-map-control-title {
        align-items: center;
        display: flex;
        font-weight: 600;
        gap: 8px;
      }
      .harvest-map-control
        label:not(.harvest-map-control-title):not(.harvest-part-filter) {
        display: block;
        font-size: 12px;
        margin-top: 8px;
      }
      .harvest-map-control input[type="range"] {
        display: block;
        width: 100%;
      }
      .harvest-part-filters {
        border: 0;
        display: grid;
        gap: 5px 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 10px 0 2px;
        padding: 0;
      }
      .harvest-part-filters legend {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 5px;
        padding: 0;
      }
      .harvest-part-filter {
        align-items: center;
        display: flex;
        font-size: 12px;
        gap: 5px;
      }
      .harvest-part-filter-icon {
        font-size: 16px;
        line-height: 1;
      }
      #harvest-window-label {
        color: #444;
        font-size: 13px;
        margin-top: 7px;
      }
      @media (max-width: 620px) {
        #map-toolbar {
          left: 10px;
          top: 10px;
        }
        .inventory-button,
        .map-mode-button {
          padding: 7px 8px;
        }
        #map-filter-panel {
          right: 10px;
          top: 58px;
          width: min(312px, calc(100vw - 20px));
        }
        #inventory-panel {
          bottom: 10px;
          left: 10px;
          max-width: calc(100vw - 20px);
          padding: 12px;
          top: 10px;
          width: calc(100vw - 20px);
        }
        .inventory-filters {
          grid-template-columns: 1fr;
        }
        .harvest-schedule {
          grid-template-columns: minmax(0, 1fr) auto 24px;
        }
        .harvest-schedule-window {
          grid-column: 1 / 3;
        }
        .harvest-edit-button {
          grid-column: 3;
          grid-row: 1 / 3;
        }
      }
      @media (hover: none) {
        .harvest-edit-button {
          opacity: 0.65;
          pointer-events: auto;
        }
      }
      @media (max-width: 760px) {
        #access-panel {
          left: 10px;
          max-width: calc(100vw - 20px);
          right: 10px;
          top: 10px;
        }
        #map-toolbar {
          left: 10px;
          top: 74px;
        }
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="map-status">Loading orchard trees…</div>
    <div id="map-toolbar" hidden>
      <button
        id="inventory-toggle"
        class="inventory-button"
        type="button"
        aria-controls="inventory-panel"
        aria-expanded="false"
      >
        Tree inventory
      </button>
      <div class="map-mode-switch" role="group" aria-label="Map mode">
        <button
          class="map-mode-button"
          type="button"
          data-map-mode="normal"
          aria-pressed="true"
        >
          Normal
        </button>
        <button
          class="map-mode-button"
          type="button"
          data-map-mode="danger"
          aria-pressed="false"
        >
          Danger
        </button>
        <button
          class="map-mode-button"
          type="button"
          data-map-mode="harvest"
          aria-pressed="false"
        >
          Harvest
        </button>
      </div>
    </div>
    <section id="access-panel" aria-label="Orchard access">
      <span id="access-mode">Public world map</span>
      <button id="login-toggle" type="button">Log in</button>
      <form id="login-form" hidden>
        <label>
          <span class="visually-hidden">Username</span>
          <input id="login-username" name="username" autocomplete="username" placeholder="Username" required />
        </label>
        <label>
          <span class="visually-hidden">Password</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
        </label>
        <button type="submit">Log in</button>
        <button id="login-cancel" class="secondary" type="button">Cancel</button>
        <span id="login-error" role="alert" hidden></span>
      </form>
      <select id="orchard-select" aria-label="Open orchard" hidden></select>
      <button id="share-orchard" type="button" hidden>Share read-only link</button>
      <button id="logout" class="secondary" type="button" hidden>Log out</button>
      <div id="share-result" hidden>
        <input id="share-link" aria-label="Read-only orchard link" readonly />
        <button id="copy-share-link" type="button">Copy</button>
      </div>
    </section>
    <aside id="inventory-panel" aria-labelledby="inventory-title" hidden>
      <header class="inventory-header">
        <h2 id="inventory-title">Orchard inventory</h2>
        <button
          id="inventory-close"
          class="inventory-close"
          type="button"
          aria-label="Close inventory"
        >
          ×
        </button>
      </header>
      <div class="inventory-tabs" role="tablist" aria-label="Inventory views">
        <button
          id="trees-tab"
          class="inventory-tab"
          type="button"
          role="tab"
          aria-controls="tree-inventory"
          aria-selected="true"
        >
          Trees
        </button>
        <button
          id="species-tab"
          class="inventory-tab"
          type="button"
          role="tab"
          aria-controls="species-inventory"
          aria-selected="false"
        >
          Species planted
        </button>
      </div>
      <section
        id="tree-inventory"
        class="inventory-view"
        role="tabpanel"
        aria-labelledby="trees-tab"
      >
        <div class="inventory-filters">
          <label>
            Role
            <select id="inventory-role-filter">
              <option value="">All roles</option>
              <option value="fruit">Fruit</option>
              <option value="pioneer">Pioneer</option>
            </select>
          </label>
          <label>
            Genus
            <select id="inventory-genus-filter">
              <option value="">All genera</option>
            </select>
          </label>
          <label>
            Species
            <select id="inventory-species-filter">
              <option value="">All species</option>
            </select>
          </label>
        </div>
        <div id="tree-result-summary" class="inventory-result-summary">
          0 trees
        </div>
        <div class="inventory-table-wrap">
          <table class="inventory-table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Botanical identity</th>
                <th scope="col">Roles</th>
                <th scope="col">Planted</th>
                <th scope="col">Condition</th>
              </tr>
            </thead>
            <tbody id="tree-inventory-body"></tbody>
          </table>
        </div>
      </section>
      <section
        id="species-inventory"
        class="inventory-view"
        role="tabpanel"
        aria-labelledby="species-tab"
        hidden
      >
        <div id="identity-result-summary" class="inventory-result-summary">
          0 planted species
        </div>
        <div class="inventory-table-wrap">
          <table class="inventory-table">
            <thead>
              <tr>
                <th scope="col">Species</th>
                <th scope="col">Harvest</th>
                <th scope="col" class="inventory-number">Trees</th>
              </tr>
            </thead>
            <tbody id="identity-inventory-body"></tbody>
          </table>
        </div>
      </section>
    </aside>
    <div id="map-filter-panel" hidden>
      <section
        id="harvest-map-filters"
        class="map-mode-filters harvest-map-control"
        aria-label="Harvest availability"
        hidden
      >
        <label class="harvest-map-control-title">
          <input type="checkbox" id="harvest-filter-enabled" checked />
          Harvest available
        </label>
        <div id="harvest-window-label">This week</div>
        <fieldset
          id="harvest-part-filters"
          class="harvest-part-filters"
        >
          <legend>Harvested parts</legend>
        </fieldset>
        <label>
          Start: <span id="harvest-offset-label">this week</span>
          <input type="range" id="harvest-offset" min="0" max="52" value="0" />
        </label>
        <label>
          Width: <span id="harvest-weeks-label">1 week</span>
          <input type="range" id="harvest-weeks" min="1" max="12" value="1" />
        </label>
      </section>
      <section id="normal-map-filters" class="map-mode-filters">
        <label
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
          "
        >
          <input type="checkbox" id="date-filter-enabled" />
          Filter by planting date
        </label>

        <div id="date-label" style="font-size: 13px; margin-bottom: 8px">
          All dates
        </div>

        <input
          type="range"
          id="date-min"
          min="0"
          max="1000"
          value="0"
          style="width: 100%"
        />
        <input
          type="range"
          id="date-max"
          min="0"
          max="1000"
          value="1000"
          style="width: 100%; margin-top: 4px"
        />
      </section>
    </div>
    <script type="module">
      import {
        HARVEST_PIN_ICONS,
        harvestPinImageName,
        selectHarvestParts,
      } from "./harvest-marker.mjs?v=2";
      import { mapModePresentation } from "./map-mode.mjs?v=3";
      import {
        filterTreeFeatures,
        harvestScheduleEndpoint,
        harvestSchedulesForSpecies,
        harvestWindowSpan,
        summarizeSpecies,
        taxonomyOptions,
      } from "./orchard-inventory.mjs?v=3";
      import {
        harvestAvailability,
        harvestAvailabilitySummary,
        parseAnnualDate,
      } from "./harvest-window.mjs?v=2";
      import {
        accessHeaders,
        hasOpenOrchard,
        orchardResourceUrl,
        resolveOrchardAccess,
        sharedOrchardUrl,
      } from "./orchard-access.mjs?v=2";

      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            "ign-ortho": {
              type: "raster",
              tiles: [
                "https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/jpeg&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}",
              ],
              tileSize: 256,
              attribution: "© IGN",
            },
            orchard: {
              type: "geojson",
              data: { type: "FeatureCollection", features: [] },
            },
          },
          layers: [
            {
              id: "ign-ortho",
              type: "raster",
              source: "ign-ortho",
            },
            {
              id: "trees",
              type: "circle",
              source: "orchard",
              paint: {
                "circle-radius": [
                  "case",
                  ["<", ["to-number", ["get", "adult_height"]], 1.4],
                  3,
                  ["<", ["to-number", ["get", "adult_height"]], 6],
                  6,
                  9,
                ],
                "circle-color": [
                  "match",
                  ["get", "row_name"],

      function createMapPinImage(fillColor, drawCenter) {
        const pixelRatio = 2;
        const width = 44;
        const height = 54;
        const canvas = document.createElement("canvas");
        canvas.width = width * pixelRatio;
        canvas.height = height * pixelRatio;
        const context = canvas.getContext("2d");
        context.scale(pixelRatio, pixelRatio);

        context.shadowColor = "rgba(0, 0, 0, 0.35)";
        context.shadowBlur = 3;
        context.shadowOffsetY = 2;
        context.beginPath();
        context.moveTo(22, 51);
        context.bezierCurveTo(18, 43, 4, 32, 4, 20);
        context.bezierCurveTo(4, 10, 12, 3, 22, 3);
        context.bezierCurveTo(32, 3, 40, 10, 40, 20);
        context.bezierCurveTo(40, 32, 26, 43, 22, 51);
        context.closePath();
        context.fillStyle = fillColor;
        context.fill();
        context.shadowColor = "transparent";
        context.lineWidth = 1.5;
        context.strokeStyle = "white";
        context.stroke();

        context.beginPath();
        context.arc(22, 20, 13, 0, Math.PI * 2);
        context.fillStyle = "#fffaf7";
        context.fill();
        drawCenter(context);

        return context.getImageData(0, 0, canvas.width, canvas.height);
      }

      function createHarvestPinImage(symbol) {

      function createDangerPinImage() {
        return createMapPinImage("#b42318", (context) => {
          context.strokeStyle = "#8f1d14";
          context.fillStyle = "#8f1d14";
          context.lineCap = "round";
          context.lineWidth = 3.5;
          context.beginPath();
          context.moveTo(22, 13);
          context.lineTo(22, 22);
          context.stroke();
          context.beginPath();
          context.arc(22, 27.5, 1.9, 0, Math.PI * 2);
          context.fill();
        });
      }

      function createDeadTreeCrossImage() {
        const size = 18;
        const pixels = new Uint8Array(size * size * 4);

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const isCross =
              Math.abs(x - y) <= 1 || Math.abs(size - 1 - x - y) <= 1;
            if (!isCross) continue;

            const offset = (y * size + x) * 4;
            pixels[offset + 3] = 255;
          }
        }

        return { width: size, height: size, data: pixels };
      }

      function createTreeEditor(feature) {
        const form = document.createElement("form");
        form.className = "tree-editor";
        const originalIsAlive = feature.properties.is_alive !== false;
        const originalIsInDanger = feature.properties.is_in_danger === true;

        const title = document.createElement("div");
        title.className = "tree-editor-title";
        title.textContent = feature.properties.name || "Tree";

        const dangerField = document.createElement("label");
        dangerField.className = "tree-editor-field";
        const dangerCheckbox = document.createElement("input");
        dangerCheckbox.type = "checkbox";
        dangerCheckbox.checked = originalIsInDanger;
        dangerField.append(
          dangerCheckbox,
          document.createTextNode("In danger"),
        );

        const deadField = document.createElement("label");
        deadField.className = "tree-editor-field";
        const deadCheckbox = document.createElement("input");
        deadCheckbox.type = "checkbox";
        deadCheckbox.checked = !originalIsAlive;
        deadField.append(deadCheckbox, document.createTextNode("Dead"));

        const note = document.createElement("div");
        note.className = "tree-editor-note";
        note.textContent = "A dead tree cannot be in danger.";

        function syncConditionControls() {
          if (deadCheckbox.checked) dangerCheckbox.checked = false;
          dangerCheckbox.disabled = deadCheckbox.checked;
          note.hidden = !deadCheckbox.checked;
        }

        deadCheckbox.addEventListener("change", syncConditionControls);
        syncConditionControls();

        const error = document.createElement("div");
        error.className = "tree-editor-error";
        error.setAttribute("aria-live", "polite");
        error.hidden = true;

        const actions = document.createElement("div");
        actions.className = "tree-editor-actions";
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.textContent = "Cancel";
        cancelButton.addEventListener("click", closeTreeEditor);
        const saveButton = document.createElement("button");
        saveButton.type = "submit";
        saveButton.textContent = "OK";
        actions.append(cancelButton, saveButton);

        form.append(title, dangerField, deadField, note);
        form.append(error, actions);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          error.hidden = true;
          dangerCheckbox.disabled = true;
          deadCheckbox.disabled = true;
          cancelButton.disabled = true;
          saveButton.disabled = true;
          saveButton.textContent = "Saving…";

          try {
            const isAlive = !deadCheckbox.checked;
            const changes = {};
            if (isAlive !== originalIsAlive) {
              changes.is_alive = isAlive;
            }
            if (
              isAlive &&
              dangerCheckbox.checked !== originalIsInDanger
            ) {
              changes.is_in_danger = dangerCheckbox.checked;
            }
            if (Object.keys(changes).length > 0) {
              await updateTree(feature.id, changes);
            }
            closeTreeEditor();
            if (Object.keys(changes).length > 0) await loadOrchardTrees();
          } catch (requestError) {
            error.textContent = requestError.message;
            error.hidden = false;
            deadCheckbox.disabled = false;
            syncConditionControls();
            cancelButton.disabled = false;
            saveButton.disabled = false;
            saveButton.textContent = "OK";
          }
        });

        return form;
      }

      async function updateTree(treeId, changes) {
        if (!isEditable()) throw new Error("This shared orchard is read only.");
        if (treeId == null) throw new Error("This tree has no editable ID.");

        const response = await fetch(orchardResourceUrl(
          currentAccess,
          `trees/${encodeURIComponent(treeId)}`,
        ), {
          method: "PATCH",
          headers: {
            "content-type": "application/json",
            ...accessHeaders(currentAccess),
          },
          body: JSON.stringify(changes),
        });
        if (response.ok) return;
        if (response.status === 404) {
          throw new Error("This tree no longer exists.");
        }
        if (response.status === 409) {
          throw new Error("A dead tree cannot be marked as in danger.");
        }
        throw new Error("Could not update this tree. Please try again.");
      }

      function formatHarvestWindows(windows) {
        return windows.length > 0
          ? windows.map(({ start, end }) => `${start} → ${end}`).join(" · ")
          : "Not set";
      }

      function showHarvestEditor(
        scheduleRow,
        schedule,
        { restore = renderHarvestSchedule, title: editorTitle = schedule.label } = {},
      ) {
        const form = document.createElement("form");
        form.className = "harvest-editor";
        const title = document.createElement("strong");
        title.textContent = editorTitle;
        const referenceRegion = document.createElement("label");
        referenceRegion.append(document.createTextNode("Reference region"));
        const referenceRegionInput = document.createElement("input");
        referenceRegionInput.type = "text";
        referenceRegionInput.required = true;
        referenceRegionInput.value =
          schedule.harvestWindows.find((window) => window.reference_region)
            ?.reference_region || "";
        referenceRegion.append(referenceRegionInput);
        const windowList = document.createElement("div");
        windowList.className = "harvest-window-list";
        const windowEditors = [];
        const addWindow = document.createElement("button");
        addWindow.type = "button";
        addWindow.textContent = "Add window";
        addWindow.addEventListener("click", () => addHarvestWindowRow());
        const clearHint = document.createElement("small");
        clearHint.textContent = "Remove every window, then OK, to clear the schedule.";
        const error = document.createElement("div");
        error.className = "harvest-editor-error";
        error.hidden = true;
        error.setAttribute("aria-live", "polite");
        const actions = document.createElement("div");
        actions.className = "harvest-editor-actions";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "Cancel";
        cancel.addEventListener("click", () => {
          restore(scheduleRow, schedule);
          scheduleRow.querySelector(".harvest-edit-button").focus();
        });
        const save = document.createElement("button");
        save.type = "submit";
        save.textContent = "OK";
        actions.append(cancel, save);
        form.append(
          title,
          referenceRegion,
          windowList,
          addWindow,
          clearHint,
          error,
          actions,
        );

        function addHarvestWindowRow(window = {}) {
          const editor = {
            row: document.createElement("div"),
            startInput: annualDateInput("Start", window.start),
            endInput: annualDateInput("End", window.end),
            harvestedPartInput: harvestedPartInput(
              "Harvested part",
              window.harvested_part || "fruit",
            ),
          };
          editor.row.className = "harvest-window-row";
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Remove";
          remove.addEventListener("click", () => {
            windowEditors.splice(windowEditors.indexOf(editor), 1);
            editor.row.remove();
          });
          editor.remove = remove;
          editor.row.append(
            editor.startInput.label,
            editor.endInput.label,
            editor.harvestedPartInput.label,
            remove,
          );
          windowEditors.push(editor);
          windowList.append(editor.row);
          editor.startInput.input.focus();
        }

        schedule.harvestWindows.forEach(addHarvestWindowRow);

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const windows = windowEditors.map((editor) => ({
            start: parseAnnualDate(editor.startInput.input.value),
            end: parseAnnualDate(editor.endInput.input.value),
            harvested_part: editor.harvestedPartInput.input.value,
          }));
          if (windows.some(({ start, end }) => !start || !end)) {
            error.textContent = "Use a valid MM-DD date, for example 08-30.";
            error.hidden = false;
            return;
          }
          error.hidden = true;
          windowEditors.forEach((editor) => {
            editor.startInput.input.disabled = true;
            editor.endInput.input.disabled = true;
            editor.harvestedPartInput.input.disabled = true;
            editor.remove.disabled = true;
          });
          referenceRegionInput.disabled = true;
          addWindow.disabled = true;
          cancel.disabled = true;
          save.disabled = true;
          save.textContent = "Saving…";
          try {
            await updateHarvestWindows(
              schedule,
              referenceRegionInput.value.trim(),
              windows,
            );
            await loadOrchardTrees();
          } catch (requestError) {
            error.textContent = requestError.message;
            error.hidden = false;
            windowEditors.forEach((editor) => {
              editor.startInput.input.disabled = false;
              editor.endInput.input.disabled = false;
              editor.harvestedPartInput.input.disabled = false;
              editor.remove.disabled = false;
            });
            referenceRegionInput.disabled = false;
            addWindow.disabled = false;
            cancel.disabled = false;
            save.disabled = false;
            save.textContent = "OK";
          }
        });

        scheduleRow.replaceChildren(form);
      }

      function annualDateInput(text, value) {
        const label = document.createElement("label");
        label.append(document.createTextNode(text));
        const input = document.createElement("input");
        input.type = "text";
        input.inputMode = "numeric";
        input.placeholder = "MM-DD";
        input.maxLength = 5;
        input.value = value || "";
        label.append(input);
        return { label, input };
      }

      function harvestedPartInput(text, value) {
        const label = document.createElement("label");
        label.append(document.createTextNode(text));
        const input = document.createElement("select");
        ["fruit", "flower", "leaf", "seed", "cone", "nut", "pod"].forEach(
          (part) => {
            const option = document.createElement("option");
            option.value = part;
            option.textContent = part;
            option.selected = part === value;
            input.append(option);
          },
        );
        label.append(input);
        return { label, input };
      }

      async function updateHarvestWindows(schedule, referenceRegion, windows) {
        if (!isEditable()) throw new Error("This shared orchard is read only.");
        const response = await fetch(
          harvestScheduleEndpoint(schedule, currentAccess.orchardId),
        {
          method: "PUT",
          headers: {
            "content-type": "application/json",
            ...accessHeaders(currentAccess),
          },
          body: JSON.stringify({ reference_region: referenceRegion, windows }),
        });
        if (response.ok) return;
        if (response.status === 400) {
          throw new Error("The harvest dates are invalid.");
        }
        if (response.status === 404) {
          throw new Error("This species or cultivar no longer exists.");
        }
        throw new Error("Could not update the harvest dates. Please try again.");
      }

      function appendCell(row, value, className) {
        const cell = document.createElement("td");
        if (className) cell.className = className;
        cell.textContent = value == null || value === "" ? "—" : String(value);
        row.append(cell);
      }

      function emptyRow(message, columnCount) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.className = "inventory-empty";
        cell.colSpan = columnCount;
        cell.textContent = message;
        row.append(cell);
        return row;
      }

      function treeCondition(properties) {
        if (properties.is_alive === false) return "Dead";
        if (properties.is_in_danger === true) return "In danger";
        return "Healthy";
      }

      map.on("mousemove", "trees", (event) => {
        map.getCanvas().style.cursor = "pointer";
        if (treeEditor) return;

        const feature = event.features[0];
        if (treeTooltip && treeTooltipTreeId === feature.id) return;

        treeTooltip?.remove();
        treeTooltip = new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 10,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(createTreeTooltip(feature.properties))
          .addTo(map);
        treeTooltipTreeId = feature.id;
      });

      map.on("mouseleave", "trees", () => {
        map.getCanvas().style.cursor = "";
        treeTooltip?.remove();
        treeTooltip = undefined;
        treeTooltipTreeId = undefined;
      });

      map.on("click", "trees", (event) => {
        const feature = event.features[0];
        treeTooltip?.remove();
        treeTooltip = undefined;
        treeTooltipTreeId = undefined;
        closeTreeEditor();

        const editable = isEditable();
        const popup = new maplibregl.Popup({
          closeButton: !editable,
          closeOnClick: false,
          offset: 12,
        })
          .setLngLat(feature.geometry.coordinates)
          .setDOMContent(
            editable
              ? createTreeEditor(feature)
              : createTreeTooltip(feature.properties),
          )
          .addTo(map);
        if (!editable) return;
        treeEditor = popup;
        popup.on("close", () => {
          if (treeEditor === popup) treeEditor = undefined;
        });
      });

      map.on("load", () => {
        Object.entries(HARVEST_PIN_ICONS).forEach(([part, symbol]) => {
          map.addImage(`harvest-${part}`, createHarvestPinImage(symbol), {
            pixelRatio: 2,
          });
        });
        map.addImage("danger-tree", createDangerPinImage(), { pixelRatio: 2 });
        map.addImage("dead-tree-cross", createDeadTreeCrossImage());
        map.addLayer({
          id: "dead-tree-crosses",
          type: "symbol",
          source: "orchard",
          filter: ["==", ["get", "is_alive"], false],
          layout: {
            "icon-image": "dead-tree-cross",
            "icon-size": [
              "case",
              ["<", ["to-number", ["get", "adult_height"]], 1.4],
              1 / 3,
              ["<", ["to-number", ["get", "adult_height"]], 6],
              2 / 3,
              1,
            ],
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
          },
          paint: {
            "icon-opacity": 0.3,
          },
        });

        applyDateFilter();
        initializeMap();
      });

      async function initializeMap() {
        await restoreSession();
        await openOrchardFromLocation();
      }

      async function restoreSession() {
        try {
          const response = await fetch("/api/session", { cache: "no-store" });
          session = response.ok ? await response.json() : null;
        } catch (error) {
          console.error("Could not restore the orchard session", error);
          session = null;
        }
      }

      async function openOrchardFromLocation() {
        const status = document.getElementById("map-status");
        currentAccess = resolveOrchardAccess(window.location.hash, session);
        renderAccessControls();
        clearOrchardPresentation();

        if (!["editable", "read-only"].includes(currentAccess.mode)) {
          map.jumpTo({ center: [0, 20], zoom: 1.5 });
          status.textContent =
            currentAccess.mode === "login-required"
              ? "Log in to open this orchard."
              : "World map · log in or open a shared orchard link to see trees.";
          status.hidden = false;
          if (currentAccess.mode === "login-required") showLoginForm();
          return;
        }

        status.textContent = "Loading orchard trees…";
        status.hidden = false;
        try {
          await loadMapConfiguration();
          await fetchOrchardTrees();
          status.hidden = true;
        } catch (error) {
          console.error("Could not initialize the orchard map", error);
          status.textContent =
            error.message === "access-denied"
              ? "This orchard link is invalid, expired, or no longer shared."
              : "Could not load this orchard. Try reloading the page.";
        }
      }

      function isEditable() {
        return currentAccess.mode === "editable";
      }

      function clearOrchardPresentation() {
        closeTreeEditor();
        setInventoryOpen(false);
        orchardFeatures = [];
        map.getSource("orchard")?.setData({
          type: "FeatureCollection",
          features: [],
        });
        aerialOverlaySources.forEach(({ sourceId, objectUrl }) => {
          const layerId = `${sourceId}-layer`;
          if (map.getLayer(layerId)) map.removeLayer(layerId);
          if (map.getSource(sourceId)) map.removeSource(sourceId);
          URL.revokeObjectURL(objectUrl);
        });
        aerialOverlaySources = [];
        refreshTaxonomyFilters();
        renderInventory();
      }

      async function loadMapConfiguration() {
        const response = await fetch(
          orchardResourceUrl(currentAccess, "map-config"),
          { headers: accessHeaders(currentAccess), cache: "no-store" },
        );
        if ([401, 403, 404].includes(response.status)) {
          throw new Error("access-denied");
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const configuration = await response.json();

        map.jumpTo({ center: configuration.default_center, zoom: 20 });
        for (const overlay of configuration.aerial_overlays) {
          const sourceId = `aerial-overlay-${overlay.id}`;
          const imageResponse = await fetch(
            orchardResourceUrl(
              currentAccess,
              `aerial-overlays/${encodeURIComponent(overlay.id)}/image`,
            ),
            { headers: accessHeaders(currentAccess), cache: "no-store" },
          );
          if (!imageResponse.ok) throw new Error(`HTTP ${imageResponse.status}`);
          const objectUrl = URL.createObjectURL(await imageResponse.blob());
          map.addSource(sourceId, {
            type: "image",
            url: objectUrl,
            coordinates: overlay.coordinates,
          });
          map.addLayer(
            {
              id: `${sourceId}-layer`,
              type: "raster",
              source: sourceId,
              paint: { "raster-opacity": 0.9 },
            },
            "trees",
          );
          aerialOverlaySources.push({ sourceId, objectUrl });
        }
      }

      async function fetchOrchardTrees() {
        const response = await fetch(
          orchardResourceUrl(currentAccess, "trees.geojson"),
          { headers: accessHeaders(currentAccess), cache: "no-store" },
        );
        if ([401, 403, 404].includes(response.status)) {
          throw new Error("access-denied");
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const orchard = await response.json();
        orchardFeatures = orchard.features || [];
        applyHarvestWindow();
        refreshTaxonomyFilters();
        renderInventory();
      }

      async function loadOrchardTrees() {
        const status = document.getElementById("map-status");
        try {
          await fetchOrchardTrees();
          status.hidden = true;
        } catch (error) {
          console.error("Could not load orchard trees", error);
          status.textContent = "Could not load orchard trees. Try reloading the page.";
          status.hidden = false;
        }
      }

      function renderAccessControls() {
        const orchardIsOpen = hasOpenOrchard(currentAccess);
        const loggedIn = session != null;
        mapToolbar.hidden = !orchardIsOpen;
        mapFilterPanel.hidden = !orchardIsOpen;
        loginToggle.hidden = loggedIn;
        orchardSelect.hidden = !loggedIn;
        logout.hidden = !loggedIn;
        shareOrchard.hidden = !isEditable();
        shareResult.hidden = true;

        if (currentAccess.mode === "read-only") {
          accessMode.textContent = "Shared orchard · read only";
        } else if (isEditable()) {
          accessMode.textContent = currentAccess.orchard.name;
        } else if (currentAccess.mode === "login-required") {
          accessMode.textContent = "Login required";
        } else {
          accessMode.textContent = "Public world map";
        }

        if (loggedIn) {
          const options = [new Option("Open my orchard…", "")];
          session.orchards.forEach((orchard) => {
            options.push(new Option(orchard.name, String(orchard.id)));
          });
          orchardSelect.replaceChildren(...options);
          orchardSelect.value = isEditable()
            ? String(currentAccess.orchardId)
            : "";
        }
      }

      function showLoginForm() {
        loginForm.hidden = false;
        loginToggle.hidden = true;
        loginError.hidden = true;
        loginUsername.focus();
      }

      async function submitLogin(event) {
        event.preventDefault();
        loginError.hidden = true;
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            username: loginUsername.value,
            password: loginPassword.value,
          }),
        });
        if (!response.ok) {
          loginError.textContent =
            response.status === 401
              ? "Incorrect username or password."
              : "Login is temporarily unavailable.";
          loginError.hidden = false;
          return;
        }
        session = await response.json();
        loginPassword.value = "";
        loginForm.hidden = true;
        const requestedOrchardId = currentAccess.orchardId;
        const orchard =
          session.orchards.find(({ id }) => id === requestedOrchardId) ||
          session.orchards[0];
        if (orchard) {
          const nextHash = `#/orchards/${encodeURIComponent(orchard.id)}`;
          if (window.location.hash === nextHash) {
            await openOrchardFromLocation();
          } else {
            window.location.hash = nextHash;
          }
        } else {
          window.location.hash = "";
          await openOrchardFromLocation();
        }
      }

      async function logOut() {
        await fetch("/api/session", { method: "DELETE" });
        session = null;
        if (currentAccess.mode !== "read-only") window.location.hash = "";
        await openOrchardFromLocation();
      }

      async function createShareLink() {
        if (!isEditable()) return;
        const response = await fetch(
          orchardResourceUrl(currentAccess, "share"),
          { method: "POST" },
        );
        if (!response.ok) {
          document.getElementById("map-status").textContent =
            "Could not create the share link.";
          document.getElementById("map-status").hidden = false;
          return;
        }
        const { share_token: token } = await response.json();
        shareLink.value = sharedOrchardUrl(
          window.location.origin,
          currentAccess.orchardId,
          token,
        );
        shareResult.hidden = false;
        shareLink.select();
        try {
          await navigator.clipboard.writeText(shareLink.value);
          copyShareLink.textContent = "Copied";
        } catch {
          copyShareLink.textContent = "Copy";
        }
      }

      function currentMapModePresentation() {
        return mapModePresentation(mapMode, {
          harvestEnabled: harvestFilterEnabled.checked,
        });
      }

      function renderMapMode() {
        const presentation = currentMapModePresentation();
        mapModeButtons.forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.mapMode === presentation.mode),
          );
        });
        mapFilterPanel.hidden =
          !hasOpenOrchard(currentAccess) || !presentation.filterPanelVisible;
        normalMapFilters.hidden = !presentation.normalFiltersVisible;
        harvestMapFilters.hidden = !presentation.harvestFiltersVisible;

        if (map.getLayer("danger-pins")) {
          map.setLayoutProperty(
            "danger-pins",
            "visibility",
            presentation.dangerPinsVisible ? "visible" : "none",
          );
        }
        if (map.getLayer("harvest-pins")) {
          map.setLayoutProperty(
            "harvest-pins",
            "visibility",
            presentation.harvestPinsVisible ? "visible" : "none",
          );
        }
      }

      function setMapMode(nextMode) {
        mapMode = nextMode;
        applyDateFilter();
        applyHarvestWindow();
      }

      function applyHarvestWindow() {
        const start = new Date();
        start.setHours(0, 0, 0, 0);
        const offset = Number(harvestOffset.value);
        const weeks = Number(harvestWeeks.value);
        start.setDate(start.getDate() + offset * 7);
        const end = new Date(start);
        end.setDate(end.getDate() + weeks * 7 - 1);

        harvestOffsetLabel.textContent =
          offset === 0
            ? "this week"
            : `in ${offset} week${offset === 1 ? "" : "s"}`;
        harvestWeeksLabel.textContent = `${weeks} week${weeks === 1 ? "" : "s"}`;
        harvestPartFilters.disabled = !harvestFilterEnabled.checked;
        const selectedParts = selectedHarvestPartValues();

        const visibleFeatures = harvestAvailability(
          orchardFeatures,
          start,
          weeks,
        ).map((feature) => {
          const visibleParts = selectHarvestParts(
            feature.properties.harvest_available_parts,
            selectedParts,
          );
          return {
            ...feature,
            properties: {
              ...feature.properties,
              harvest_available: visibleParts.length > 0,
              harvest_available_parts: visibleParts,
              harvest_pin_image: harvestPinImageName(visibleParts),
            },
          };
        });
        const summary = harvestAvailabilitySummary(visibleFeatures);
        const dateFormatter = new Intl.DateTimeFormat(undefined, {
          day: "numeric",
          month: "short",
        });
        harvestWindowLabel.textContent = harvestFilterEnabled.checked
          ? `${dateFormatter.format(start)} → ${dateFormatter.format(end)} · ${summary.trees} tree${summary.trees === 1 ? "" : "s"} · ${summary.species} species`
          : "Harvest display hidden";

        const source = map.getSource("orchard");
        if (source) {
          source.setData({
            type: "FeatureCollection",
            features: visibleFeatures,
          });
        }
        renderMapMode();
      }

      // ===== Date range filter =====
      const dateMinSlider = document.getElementById("date-min");
      const dateMaxSlider = document.getElementById("date-max");
      const dateLabel = document.getElementById("date-label");
      const dateFilterEnabled = document.getElementById("date-filter-enabled");

      const minDate = new Date("2021-04-01");
      const maxDate = new Date("2024-12-31");
      const totalDays = (maxDate - minDate) / (1000 * 60 * 60 * 24);

      function daysToDate(days) {
        const d = new Date(minDate);
        d.setDate(d.getDate() + Number(days));
        return d;
      }

      function formatDate(d) {
        return d.toISOString().slice(0, 10);
      }

      function applyDateFilter() {
        if (!currentMapModePresentation().plantingDateFilterActive) {
          if (map.getLayer("trees")) map.setFilter("trees", null);
          return;
        }

        if (!dateFilterEnabled.checked) {
          if (map.getLayer("trees")) map.setFilter("trees", null);
          dateLabel.textContent = "All dates";
          dateMinSlider.disabled = true;
          dateMaxSlider.disabled = true;
          return;
        }

        dateMinSlider.disabled = false;
        dateMaxSlider.disabled = false;

        let minVal = Number(dateMinSlider.value);
        let maxVal = Number(dateMaxSlider.value);

        if (minVal > maxVal) {
          [minVal, maxVal] = [maxVal, minVal];
          dateMinSlider.value = minVal;
          dateMaxSlider.value = maxVal;
        }

        const from = daysToDate(minVal);
        const to = daysToDate(maxVal);

        dateLabel.textContent = `${formatDate(from)} → ${formatDate(to)}`;

        if (map.getLayer("trees")) {
          const plantingDateFilter = [
            "all",
            [">=", ["get", "planted_on"], formatDate(from)],
            ["<=", ["get", "planted_on"], formatDate(to)],
          ];
          map.setFilter("trees", plantingDateFilter);
        }
      }

      dateMinSlider.addEventListener("input", applyDateFilter);
      dateMaxSlider.addEventListener("input", applyDateFilter);
      dateFilterEnabled.addEventListener("change", applyDateFilter);
      harvestFilterEnabled.addEventListener("change", applyHarvestWindow);
      harvestOffset.addEventListener("input", applyHarvestWindow);
      harvestWeeks.addEventListener("input", applyHarvestWindow);
      mapModeButtons.forEach((button) => {
        button.addEventListener("click", () => setMapMode(button.dataset.mapMode));
      });

      inventoryToggle.addEventListener("click", () => setInventoryOpen(true));
      inventoryClose.addEventListener("click", () => setInventoryOpen(false));
      treesTab.addEventListener("click", () => selectInventoryView("trees"));
      speciesTab.addEventListener("click", () =>
        selectInventoryView("species"),
      );
      roleFilter.addEventListener("change", renderTreeInventory);
      speciesFilter.addEventListener("change", renderTreeInventory);
      genusFilter.addEventListener("change", () => {
        refreshSpeciesFilter();
        renderTreeInventory();
      });
      loginToggle.addEventListener("click", showLoginForm);
      loginCancel.addEventListener("click", () => {
        loginForm.hidden = true;
        loginError.hidden = true;
        loginToggle.hidden = session != null;
      });
      loginForm.addEventListener("submit", submitLogin);
      orchardSelect.addEventListener("change", () => {
        if (!orchardSelect.value) return;
        window.location.hash = `#/orchards/${encodeURIComponent(orchardSelect.value)}`;
      });
      shareOrchard.addEventListener("click", createShareLink);
      copyShareLink.addEventListener("click", async () => {
        shareLink.select();
        try {
          await navigator.clipboard.writeText(shareLink.value);
          copyShareLink.textContent = "Copied";
        } catch {
          document.execCommand("copy");
        }
      });
      logout.addEventListener("click", logOut);
      window.addEventListener("hashchange", openOrchardFromLocation);

      // Init
      dateMinSlider.max = totalDays;
      dateMaxSlider.max = totalDays;
      dateMaxSlider.value = totalDays;
      renderHarvestPartFilters();
      setMapMode("normal");
    </script>
  </body>
</html>
