services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: orchard
      POSTGRES_USER: orchard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - orchard-db-data:/var/lib/postgresql/data
      - ./api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchard -d orchard"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      ORCHARD_DATABASE_URL: "postgres://orchard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/orchard"
    command: ["runserver", "--address", "0.0.0.0:3000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data:ro

  db-test:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_DB: orchard_test
      POSTGRES_USER: orchard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./api/db/migrations:/docker-entrypoint-initdb.d:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  orchard-db-data:
