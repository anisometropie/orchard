[package]
name = "orchard-api"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "http_create_tree_integration"
path = "src/adapters/primary/http_create_tree_integration_test.rs"

[[test]]
name = "create_tree_unit"
path = "src/hexagon/use_cases/create_tree/create_tree_unit_test.rs"
