[package]
name = "orchard-api"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
postgres-integration = []

[dependencies]
axum = "0.8"
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "http_create_tree_integration"
path = "src/adapters/primary/http/http_create_tree_integration_test.rs"

[[test]]
name = "geojson_legacy_orchard_import_integration"
path = "src/adapters/primary/geojson_legacy_orchard_import/geojson_legacy_orchard_import_integration_test.rs"

[[test]]
name = "create_tree_unit"
path = "src/hexagon/use_cases/create_tree/create_tree_unit_test.rs"

[[test]]
name = "import_legacy_orchard_unit"
path = "src/hexagon/use_cases/import_legacy_orchard/import_legacy_orchard_unit_test.rs"

[[test]]
name = "in_memory_orchard_storage_integration"
path = "src/adapters/secondary/in_memory_orchard_storage/in_memory_orchard_storage_integration_test.rs"

[[test]]
name = "postgres_orchard_storage_integration"
path = "src/adapters/secondary/postgres_orchard_storage/postgres_orchard_storage_integration_test.rs"
required-features = ["postgres-integration"]

[[test]]
name = "legacy_orchard_import_cli_e2e"
path = "src/adapters/primary/legacy_orchard_import_cli/legacy_orchard_import_cli_e2e_test.rs"
required-features = ["postgres-integration"]
