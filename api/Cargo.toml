[package]
name = "orchard-api"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
postgres-integration = []

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
postgres = "0.19"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[test]]
name = "http_create_tree_integration"
path = "src/adapters/primary/http/http_create_tree_integration_test.rs"

[[test]]
name = "http_orchard_access_integration"
path = "src/adapters/primary/http/http_orchard_access_integration_test.rs"

[[test]]
name = "geojson_legacy_orchard_import_integration"
path = "src/adapters/primary/geojson_legacy_orchard_import/geojson_legacy_orchard_import_integration_test.rs"

[[test]]
name = "create_tree_unit"
path = "src/hexagon/use_cases/create_tree/create_tree_unit_test.rs"

[[test]]
name = "import_legacy_orchard_unit"
path = "src/hexagon/use_cases/import_legacy_orchard/import_legacy_orchard_unit_test.rs"

[[test]]
name = "list_orchard_trees_unit"
path = "src/hexagon/use_cases/list_orchard_trees/list_orchard_trees_unit_test.rs"

[[test]]
name = "load_map_configuration_unit"
path = "src/hexagon/use_cases/load_map_configuration/load_map_configuration_unit_test.rs"

[[test]]
name = "load_aerial_overlay_image_unit"
path = "src/hexagon/use_cases/load_aerial_overlay_image/load_aerial_overlay_image_unit_test.rs"

[[test]]
name = "change_tree_condition_unit"
path = "src/hexagon/use_cases/change_tree_condition/change_tree_condition_unit_test.rs"

[[test]]
name = "in_memory_orchard_storage_integration"
path = "src/adapters/secondary/in_memory_orchard_storage/in_memory_orchard_storage_integration_test.rs"

[[test]]
name = "postgres_orchard_storage_integration"
path = "src/adapters/secondary/postgres_orchard_storage/postgres_orchard_storage_integration_test.rs"
required-features = ["postgres-integration"]

[[test]]
name = "orchard_cli_e2e"
path = "src/adapters/primary/orchard_cli/orchard_cli_e2e_test.rs"
required-features = ["postgres-integration"]
